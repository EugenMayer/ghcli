name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -s -l .)" || (gofmt -s -l . && exit 1)
      - run: make vet
      - run: make test
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: ghcli
          path: dist/
